[project]
name = "churn-radar"
version = "1.0.0"
description = "ML Platform for Customer Churn Prediction"
requires-python = ">=3.11"
authors = [
    {name = "ML Team", email = "mlops@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
keywords = ["machine-learning", "churn-prediction", "mlops", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.scripts]
churn = "src.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/churn-radar"
Documentation = "https://yourname.github.io/churn-radar"
Repository = "https://github.com/yourname/churn-radar"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "W", "C90", "UP", "S"]
ignore = ["E501", "S101", "S104"]
exclude = ["build", "dist", ".venv", "mlruns"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.per-file-ignores]
"tests/*" = ["S101"]

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["mlruns/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["mlruns", "site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/cli.py", "*/tests/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 70

[tool.bandit]
exclude_dirs = ["tests", "mlruns", ".venv"]
skips = ["B101", "B104"]

[tool.bandit.assert_used]
skips = ["*_test.py", "test_*.py"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
